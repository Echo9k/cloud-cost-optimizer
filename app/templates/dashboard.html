<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cloud Cost Optimizer</title>
  <style>
    :root {
      --bg: #0f172a; --panel: #1e293b; --panel2: #273449;
      --text: #e2e8f0; --muted: #94a3b8; --line: #334155;
      --accent: #38bdf8; --good: #22c55e; --warn: #f59e0b; --bad: #ef4444;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: var(--bg); color: var(--text);
    }
    header {
      padding: 20px 28px; border-bottom: 1px solid var(--line);
      display: flex; align-items: center; justify-content: space-between;
    }
    header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; }
    header .sub { color: var(--muted); font-size: 13px; }
    .actions button {
      background: var(--accent); color: #042; border: 0; padding: 9px 14px;
      border-radius: 8px; font-weight: 600; cursor: pointer; margin-left: 8px;
    }
    .actions button.ghost { background: var(--panel2); color: var(--text); }
    .actions button:active { transform: translateY(1px); }
    main { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
    .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .kpi {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 12px; padding: 16px 18px;
    }
    .kpi .label { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .5px; }
    .kpi .value { font-size: 26px; font-weight: 700; margin-top: 6px; }
    .kpi .value.good { color: var(--good); }
    .kpi .value.warn { color: var(--warn); }
    section { margin-top: 28px; }
    section h2 { font-size: 15px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .bars { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    .bar-row { display: flex; align-items: center; gap: 12px; margin: 8px 0; }
    .bar-row .name { width: 110px; font-size: 13px; color: var(--muted); text-transform: capitalize; }
    .bar-track { flex: 1; background: var(--panel2); border-radius: 6px; height: 20px; overflow: hidden; }
    .bar-fill { height: 100%; background: linear-gradient(90deg, #0ea5e9, #38bdf8); }
    .bar-row .amt { width: 90px; text-align: right; font-variant-numeric: tabular-nums; }
    table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 12px; overflow: hidden; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); font-size: 13px; }
    th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .5px; }
    tr:last-child td { border-bottom: 0; }
    .pill { padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
    .sev-high { background: rgba(239,68,68,.18); color: #fca5a5; }
    .sev-medium { background: rgba(245,158,11,.18); color: #fcd34d; }
    .sev-low { background: rgba(148,163,184,.18); color: #cbd5e1; }
    .type { color: var(--accent); font-weight: 600; text-transform: capitalize; }
    td.savings { color: var(--good); font-weight: 600; font-variant-numeric: tabular-nums; }
    .row-actions button {
      border: 1px solid var(--line); background: var(--panel2); color: var(--text);
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; margin-right: 6px;
    }
    .row-actions button.apply { border-color: var(--good); color: #86efac; }
    .empty { color: var(--muted); padding: 24px; text-align: center; }
    .toast {
      position: fixed; bottom: 20px; right: 20px; background: var(--panel2);
      border: 1px solid var(--line); padding: 12px 16px; border-radius: 10px;
      opacity: 0; transition: opacity .2s; max-width: 360px; font-size: 13px;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>☁️ Cloud Cost Optimizer <span class="sub">& Remediation Engine</span></h1>
      <div class="sub" id="status">Loading…</div>
    </div>
    <div class="actions">
      <button class="ghost" onclick="seedData()">Load Demo Fleet</button>
      <button onclick="runScan()">Run Optimizer Scan</button>
    </div>
  </header>

  <main>
    <div class="kpis" id="kpis"></div>

    <section>
      <h2>Potential Savings by Category</h2>
      <div class="bars" id="bars"><div class="empty">No data yet.</div></div>
    </section>

    <section>
      <h2>Open Recommendations</h2>
      <div id="recs"><div class="empty">Run a scan to generate recommendations.</div></div>
    </section>
  </main>

  <div class="toast" id="toast"></div>

  <script>
    const $ = (id) => document.getElementById(id);
    const money = (n) => "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });

    function toast(msg) {
      const t = $("toast");
      t.textContent = msg; t.classList.add("show");
      setTimeout(() => t.classList.remove("show"), 3200);
    }

    async function api(method, path, body) {
      const opts = { method, headers: { "Content-Type": "application/json" } };
      if (body !== undefined) opts.body = JSON.stringify(body);
      const res = await fetch(path, opts);
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || res.statusText);
      }
      return res.status === 204 ? null : res.json();
    }

    async function refresh() {
      const [summary, recs] = await Promise.all([
        api("GET", "/api/summary"),
        api("GET", "/api/recommendations?status=open"),
      ]);
      renderKpis(summary);
      renderBars(summary);
      renderRecs(recs);
      $("status").textContent =
        `${summary.total_resources} resources tracked · ${summary.open_recommendations} open findings`;
    }

    function renderKpis(s) {
      const cards = [
        { label: "Monthly Spend", value: money(s.total_monthly_cost) },
        { label: "Potential Savings", value: money(s.potential_monthly_savings), cls: "warn" },
        { label: "Realized Savings", value: money(s.realized_monthly_savings), cls: "good" },
        { label: "Open Findings", value: s.open_recommendations },
      ];
      $("kpis").innerHTML = cards.map(c =>
        `<div class="kpi"><div class="label">${c.label}</div>
         <div class="value ${c.cls || ''}">${c.value}</div></div>`).join("");
    }

    function renderBars(s) {
      const entries = Object.entries(s.savings_by_type).sort((a, b) => b[1] - a[1]);
      if (!entries.length) { $("bars").innerHTML = '<div class="empty">No savings opportunities detected.</div>'; return; }
      const max = Math.max(...entries.map(e => e[1]), 1);
      $("bars").innerHTML = entries.map(([name, amt]) =>
        `<div class="bar-row">
           <div class="name">${name}</div>
           <div class="bar-track"><div class="bar-fill" style="width:${(amt / max * 100).toFixed(1)}%"></div></div>
           <div class="amt">${money(amt)}</div>
         </div>`).join("");
    }

    function renderRecs(recs) {
      if (!recs.length) { $("recs").innerHTML = '<div class="empty">No open recommendations. 🎉</div>'; return; }
      const rows = recs.map(r => `
        <tr>
          <td><span class="type">${r.rec_type}</span></td>
          <td><span class="pill sev-${r.severity}">${r.severity}</span></td>
          <td>#${r.resource_id}</td>
          <td>${r.rationale}</td>
          <td class="savings">${money(r.estimated_monthly_savings)}</td>
          <td class="row-actions">
            <button class="apply" onclick="remediate(${r.id}, false)">Apply</button>
            <button onclick="remediate(${r.id}, true)">Dry Run</button>
            <button onclick="dismiss(${r.id})">Dismiss</button>
          </td>
        </tr>`).join("");
      $("recs").innerHTML =
        `<table><thead><tr><th>Type</th><th>Severity</th><th>Resource</th>
         <th>Rationale</th><th>Est. Savings/mo</th><th>Actions</th></tr></thead>
         <tbody>${rows}</tbody></table>`;
    }

    async function seedData() {
      try { const r = await api("POST", "/api/resources/seed"); toast(`Loaded ${r.seeded_resources} demo resources.`); await refresh(); }
      catch (e) { toast("Error: " + e.message); }
    }
    async function runScan() {
      try {
        const r = await api("POST", "/api/optimizer/scan");
        toast(`Scanned ${r.scanned_resources} resources · ${r.recommendations_created} findings · ${money(r.potential_monthly_savings)}/mo potential.`);
        await refresh();
      } catch (e) { toast("Error: " + e.message); }
    }
    async function remediate(id, dry) {
      try {
        const r = await api("POST", `/api/recommendations/${id}/remediate`, { dry_run: dry });
        toast(r.detail);
        await refresh();
      } catch (e) { toast("Error: " + e.message); }
    }
    async function dismiss(id) {
      try { await api("POST", `/api/recommendations/${id}/dismiss`); toast("Recommendation dismissed."); await refresh(); }
      catch (e) { toast("Error: " + e.message); }
    }

    refresh().catch(() => $("status").textContent = "API unreachable.");
  </script>
</body>
</html>
